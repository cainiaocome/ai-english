name: CI

on:
  push:
    branches: [main, master, copilot-working-branch]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -p ai-english-engine -- --check

      - name: Run clippy
        run: cargo clippy -p ai-english-engine --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p ai-english-engine

  test-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [test-rust, test-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache whisper.cpp
        uses: actions/cache@v4
        with:
          path: deps/whisper.cpp
          key: ${{ runner.os }}-whisper-v1
          restore-keys: |
            ${{ runner.os }}-whisper-

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Ad-hoc sign the app
        run: |
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Signing $APP_PATH"
            codesign --force --deep --sign - "$APP_PATH"
            # Create a zip that preserves the app bundle structure
            cd src-tauri/target/release/bundle/macos
            zip -r ai-english-macos.zip *.app
          fi

      - name: Run smoke test
        run: |
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -type d | head -1)
          chmod +x tests/smoke-test.sh
          ./tests/smoke-test.sh "$APP_PATH"

      - name: Run OCR integration test
        run: swift tests/integration/ocr_test.swift

      - name: Run screen capture integration test
        run: swift tests/integration/screen_capture_test.swift

      - name: Build Swift plugins
        run: |
          cd macos-plugin
          swift build

      - name: Run TTS integration test
        run: |
          echo "Testing macOS TTS (say command)..."
          TEMP_TTS="/tmp/tts_test.aiff"
          say -o "$TEMP_TTS" "Hello world, this is a text to speech test"
          if [ -f "$TEMP_TTS" ] && [ -s "$TEMP_TTS" ]; then
            echo "✓ TTS generated audio successfully"
            ls -la "$TEMP_TTS"
            rm -f "$TEMP_TTS"
          else
            echo "✗ TTS test failed"
            exit 1
          fi

      - name: Run audio transcription test
        run: |
          echo "Testing whisper.cpp audio transcription..."
          chmod +x tests/integration/audio_test.sh
          RUN_AUDIO_TEST=true ./tests/integration/audio_test.sh

      - name: Run E2E test
        run: |
          echo "Running end-to-end test..."
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -type d | head -1)
          chmod +x tests/e2e/app_test.sh
          ./tests/e2e/app_test.sh "$APP_PATH"

      - name: Upload macOS App (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: src-tauri/target/release/bundle/macos/ai-english-macos.zip
          if-no-files-found: ignore

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/
          if-no-files-found: ignore
