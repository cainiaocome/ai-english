[package]
name = "ai-english-engine"
version = "0.1.0"
edition = "2021"
description = "Core engine for AI English Learning Assistant"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
parking_lot = "0.12"

[dev-dependencies]
pretty_assertions = "1"
